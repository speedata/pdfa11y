rules:
  - vera: UA1:5-1
    object: MainXMPPackage
    desc: The PDF/UA version and conformance level of a file shall be specified using the PDF/UA Identification extension schema
    status: covered
    checks:
      - UA-06-003
  - vera: UA1:5-2
    object: PDFUAIdentification
    desc: The value of "pdfuaid:part" shall be the part number of the International Standard to which the file conforms
    status: partial
    checks:
      - UA-06-003
    note: UA-06-003 checks the PDF/UA identifier is present; corpus 5-t02-fail-a shows it does not flag a wrong pdfuaid:part value for UA-1.
  - vera: UA1:5-3
    object: PDFUAIdentification
    desc: Property "part" of the PDF/UA Identification Schema shall have namespace prefix "pdfuaid"
    status: n/a
    checks: []
    note: XMP schema namespace-prefix mechanics; pdfa11y reads pdfuaid:part directly and does not validate schema prefix declarations.
  - vera: UA1:5-4
    object: PDFUAIdentification
    desc: Property "amd" of the PDF/UA Identification Schema shall have namespace prefix "pdfuaid"
    status: n/a
    checks: []
    note: XMP schema namespace-prefix mechanics; pdfa11y reads pdfuaid:part directly and does not validate schema prefix declarations.
  - vera: UA1:5-5
    object: PDFUAIdentification
    desc: Property "corr" of the PDF/UA Identification Schema shall have namespace prefix "pdfuaid"
    status: n/a
    checks: []
    note: XMP schema namespace-prefix mechanics; pdfa11y reads pdfuaid:part directly and does not validate schema prefix declarations.
  - vera: UA1:6.1-1
    object: CosDocument
    desc: The file header shall consist of "%PDF-1.n" followed by a single EOL marker, where 'n' is a single digit number between 0 (30h) and 7 (37h)
